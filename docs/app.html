<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your workspace — CRM Scoring</title>
<meta name="description" content="Upload leads, see them scored and ranked, download the results." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,440;0,9..144,600;0,9..144,680;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  /* Same "Ledger" tokens as docs/index.html / docs/login.html -- kept in
     sync so every page on this site reads as the same product. */
  :root {
    --text-h: #211b12; --text: #6b6152; --text-muted: #8a7e6d;
    --bg: #f6f1e6; --bg-alt: #fffcf5; --border: #e6dbc3;
    --accent: #b3401f; --accent-dark: #8f3018; --accent-bg: rgba(179, 64, 31, 0.1);
    --hot: #c53a2c; --hot-bg: rgba(197, 58, 44, 0.1);
    --warm: #a8710f; --warm-bg: rgba(168, 113, 15, 0.13);
    --cold: #5b6472; --cold-bg: rgba(91, 100, 114, 0.12);
    --dot: rgba(33, 27, 18, 0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text-h: #f4ead9; --text: #b6a993; --text-muted: #8d8069;
      --bg: #18130c; --bg-alt: #211a11; --border: #382d1e;
      --accent: #e37a4c; --accent-dark: #ef9264; --accent-bg: rgba(227, 122, 76, 0.16);
      --hot: #ea6a53; --hot-bg: rgba(234, 106, 83, 0.18);
      --warm: #dba43b; --warm-bg: rgba(219, 164, 59, 0.18);
      --cold: #8b93a3; --cold-bg: rgba(139, 147, 163, 0.18);
      --dot: rgba(244, 234, 217, 0.06);
    }
  }
  :root[data-theme="dark"] {
    --text-h: #f4ead9; --text: #b6a993; --text-muted: #8d8069;
    --bg: #18130c; --bg-alt: #211a11; --border: #382d1e;
    --accent: #e37a4c; --accent-dark: #ef9264; --accent-bg: rgba(227, 122, 76, 0.16);
    --hot: #ea6a53; --hot-bg: rgba(234, 106, 83, 0.18);
    --warm: #dba43b; --warm-bg: rgba(219, 164, 59, 0.18);
    --cold: #8b93a3; --cold-bg: rgba(139, 147, 163, 0.18);
    --dot: rgba(244, 234, 217, 0.06);
  }
  :root[data-theme="light"] {
    --text-h: #211b12; --text: #6b6152; --text-muted: #8a7e6d;
    --bg: #f6f1e6; --bg-alt: #fffcf5; --border: #e6dbc3;
    --accent: #b3401f; --accent-dark: #8f3018; --accent-bg: rgba(179, 64, 31, 0.1);
    --hot: #c53a2c; --hot-bg: rgba(197, 58, 44, 0.1);
    --warm: #a8710f; --warm-bg: rgba(168, 113, 15, 0.13);
    --cold: #5b6472; --cold-bg: rgba(91, 100, 114, 0.12);
    --dot: rgba(33, 27, 18, 0.07);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1.4px, transparent 1.4px);
    background-size: 26px 26px;
    color: var(--text); line-height: 1.5;
  }
  h1, h2, h3, .logo-word { font-family: "Fraunces", ui-serif, Georgia, serif; color: var(--text-h); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px 64px; }
  header.nav { display: flex; align-items: center; justify-content: space-between; padding: 22px 0; }
  .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
  .logo-dots { display: flex; gap: 3px; }
  .logo-dots span { width: 7px; height: 7px; border-radius: 999px; display: block; }
  .logo-dots span:nth-child(1) { background: var(--hot); }
  .logo-dots span:nth-child(2) { background: var(--warm); }
  .logo-dots span:nth-child(3) { background: var(--cold); }
  .logo-word { font-weight: 600; font-size: 1.2rem; letter-spacing: -0.01em; }
  .logo-word em { font-style: normal; color: var(--accent); }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .rise { opacity: 0; animation: rise 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @media (prefers-reduced-motion: reduce) { .rise { opacity: 1; animation: none; } }

  .btn { display: inline-block; padding: 9px 16px; border-radius: 4px; font-weight: 600; text-decoration: none; font-size: 0.88rem; border: 1px solid transparent; cursor: pointer; font-family: inherit; transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .btn-primary { background: var(--accent); color: #fff8ef; }
  .btn-primary:hover { background: var(--accent-dark); transform: translateY(-1px); box-shadow: 0 6px 16px -6px var(--accent); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-secondary { background: transparent; color: var(--text-h); border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn-secondary.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }

  .card { border: 1px solid var(--border); border-radius: 10px; background: var(--bg-alt); padding: 24px; margin-bottom: 20px; }
  .card h2 { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; }
  .card p.lede { color: var(--text-muted); font-size: 0.88rem; margin: 0 0 18px; }

  .example-banner {
    border: 1px solid var(--accent); background: var(--accent-bg); border-radius: 8px;
    padding: 14px 18px; margin-bottom: 20px; font-size: 0.88rem; color: var(--text-h);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }

  .dropzone { border: 1px dashed var(--border); border-radius: 8px; padding: 32px; text-align: center; }
  .dropzone .caption { font-size: 0.82rem; color: var(--text-muted); margin-top: 8px; }
  input[type="file"] { display: none; }

  .chart-picker { display: flex; gap: 6px; margin-bottom: 16px; }
  .chart-picker .btn { padding: 6px 12px; font-size: 0.8rem; }

  .legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-muted); font-family: "IBM Plex Mono", monospace; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  table.results { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  table.results th, table.results td { padding: 10px 12px; text-align: left; }
  table.results thead th { color: var(--text-muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); font-family: "IBM Plex Mono", monospace; }
  table.results tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  table.results td.num { font-family: "IBM Plex Mono", monospace; }
  .bucket-badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 10px; font-weight: 600; text-transform: uppercase; font-family: "IBM Plex Mono", monospace; letter-spacing: 0.03em; }
  .bucket-hot { background: var(--hot-bg); color: var(--hot); }
  .bucket-warm { background: var(--warm-bg); color: var(--warm); }
  .bucket-cold { background: var(--cold-bg); color: var(--cold); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .error-text { color: var(--hot); font-size: 0.85rem; }
  .empty { color: var(--text-muted); font-size: 0.88rem; padding: 20px 0; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <a class="logo" href="index.html">
        <span class="logo-dots"><span></span><span></span><span></span></span>
        <span class="logo-word">CRM <em>Scoring</em></span>
      </a>
      <button class="btn btn-secondary" onclick="disconnect()">Log out</button>
    </header>

    <div id="example-banner" class="example-banner rise" style="display:none;">
      <span>This is an example of what you'll get back — upload your own file below to replace it.</span>
      <button class="btn btn-secondary" onclick="dismissExample()">Got it</button>
    </div>

    <div class="card rise" style="animation-delay:40ms;">
      <h2>Upload leads</h2>
      <p class="lede">CSV or XLSX with at least a company name and domain column.</p>
      <div class="dropzone">
        <input type="file" id="upload-input" accept=".csv,.xlsx,.xls" />
        <button class="btn btn-secondary" onclick="document.getElementById('upload-input').click()">Choose file</button>
        <button class="btn btn-primary" id="upload-btn" disabled onclick="handleUpload()">Score it</button>
        <p class="caption" id="upload-filename"></p>
        <p class="error-text" id="upload-error" style="display:none;"></p>
      </div>
    </div>

    <div class="card rise" style="animation-delay:90ms;">
      <div class="toolbar">
        <h2 style="margin:0;">Results (<span id="results-count">0</span>)</h2>
        <button class="btn btn-secondary" id="download-btn" onclick="downloadCsv()" disabled>Download CSV</button>
      </div>

      <div class="chart-picker">
        <button class="btn btn-secondary active" id="chart-btn-bar" onclick="setChartType('bar')">Bar</button>
        <button class="btn btn-secondary" id="chart-btn-donut" onclick="setChartType('donut')">Donut</button>
        <button class="btn btn-secondary" id="chart-btn-table" onclick="setChartType('table')">Table</button>
      </div>

      <div id="chart-area"></div>
      <div id="results-empty" class="empty">No leads yet — upload a file above to get started.</div>
      <div id="results-table-wrap" style="display:none; overflow-x:auto;">
        <table class="results" id="results-table">
          <thead>
            <tr><th>Company</th><th>Industry</th><th>Fit</th><th>LLM</th><th>Combined</th><th>Bucket</th></tr>
          </thead>
          <tbody id="results-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    var API_BASE = "https://disobey-battered-deploy.ngrok-free.dev/api";
    var WORKSPACE_KEY_STORAGE = "crmscoring_workspace_key";
    var NEW_USER_STORAGE = "crmscoring_new_user";
    var CHART_TYPE_STORAGE = "crmscoring_chart_type";

    var workspaceKey = localStorage.getItem(WORKSPACE_KEY_STORAGE);
    if (!workspaceKey) {
      window.location.href = "login.html";
    }

    var isExample = localStorage.getItem(NEW_USER_STORAGE) === "1";
    var chartType = localStorage.getItem(CHART_TYPE_STORAGE) || "bar";
    var currentLeads = [];

    // Sample dataset shown once to a brand-new signup, so they see what a
    // scored result looks like before they've uploaded anything of their
    // own -- purely illustrative, never sent to/from the backend.
    var EXAMPLE_LEADS = [
      { company_name: "Northwind Analytics", industry: "SaaS", fit_score: 81, conversion_likelihood: 88, combined_score: 84, bucket: "hot" },
      { company_name: "Fintura Pay", industry: "Fintech", fit_score: 85, conversion_likelihood: 80, combined_score: 83, bucket: "hot" },
      { company_name: "Vitalis Health", industry: "Healthcare Tech", fit_score: 81, conversion_likelihood: 74, combined_score: 78, bucket: "hot" },
      { company_name: "Ledger Logistics", industry: "Logistics", fit_score: 62, conversion_likelihood: 65, combined_score: 63, bucket: "warm" },
      { company_name: "Tiny Print Shop", industry: "Printing", fit_score: 50, conversion_likelihood: 43, combined_score: 47, bucket: "cold" },
    ];

    function disconnect() {
      localStorage.removeItem(WORKSPACE_KEY_STORAGE);
      localStorage.removeItem(NEW_USER_STORAGE);
      window.location.href = "login.html";
    }

    function dismissExample() {
      isExample = false;
      localStorage.setItem(NEW_USER_STORAGE, "0");
      document.getElementById("example-banner").style.display = "none";
      loadRealLeads();
    }

    function authHeaders() {
      return { Authorization: "Bearer " + workspaceKey, "ngrok-skip-browser-warning": "true" };
    }

    function escapeHtml(str) {
      var div = document.createElement("div");
      div.textContent = str == null ? "" : str;
      return div.innerHTML;
    }

    function bucketCounts(leads) {
      var counts = { hot: 0, warm: 0, cold: 0 };
      leads.forEach(function (l) { counts[l.bucket] = (counts[l.bucket] || 0) + 1; });
      return counts;
    }

    function renderTable(leads) {
      var tbody = document.getElementById("results-tbody");
      tbody.innerHTML = "";
      leads.forEach(function (l) {
        var tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + escapeHtml(l.company_name) + "</td>" +
          "<td>" + escapeHtml(l.industry || "—") + "</td>" +
          "<td class=\"num\">" + Math.round(l.fit_score) + "</td>" +
          "<td class=\"num\">" + Math.round(l.conversion_likelihood) + "</td>" +
          "<td class=\"num\"><strong>" + Math.round(l.combined_score) + "</strong></td>" +
          "<td><span class=\"bucket-badge bucket-" + l.bucket + "\">" + l.bucket + "</span></td>";
        tbody.appendChild(tr);
      });
    }

    function legendHtml(counts) {
      return (
        "<div class=\"legend\">" +
        "<span class=\"legend-item\"><span class=\"swatch\" style=\"background:var(--hot)\"></span>Hot (" + counts.hot + ")</span>" +
        "<span class=\"legend-item\"><span class=\"swatch\" style=\"background:var(--warm)\"></span>Warm (" + counts.warm + ")</span>" +
        "<span class=\"legend-item\"><span class=\"swatch\" style=\"background:var(--cold)\"></span>Cold (" + counts.cold + ")</span>" +
        "</div>"
      );
    }

    function renderBarChart(counts) {
      var max = Math.max(counts.hot, counts.warm, counts.cold, 1);
      var rows = [
        { label: "Hot", value: counts.hot, color: "var(--hot)" },
        { label: "Warm", value: counts.warm, color: "var(--warm)" },
        { label: "Cold", value: counts.cold, color: "var(--cold)" },
      ];
      var html = '<svg viewBox="0 0 400 110" width="100%" height="130" role="img" aria-label="Lead count by bucket">';
      rows.forEach(function (row, i) {
        var y = i * 36 + 8;
        var w = Math.max((row.value / max) * 300, row.value > 0 ? 6 : 0);
        html +=
          '<text x="0" y="' + (y + 14) + '" font-size="12" font-family="IBM Plex Mono, monospace" fill="var(--text-muted)">' + row.label + '</text>' +
          '<rect x="52" y="' + y + '" width="300" height="18" rx="3" fill="var(--border)" opacity="0.5"></rect>' +
          '<rect x="52" y="' + y + '" width="' + w + '" height="18" rx="3" fill="' + row.color + '"></rect>' +
          '<text x="' + (52 + w + 8) + '" y="' + (y + 14) + '" font-size="12" font-family="IBM Plex Mono, monospace" fill="var(--text-h)">' + row.value + '</text>';
      });
      html += "</svg>";
      return html + legendHtml(counts);
    }

    function renderDonutChart(counts) {
      var total = counts.hot + counts.warm + counts.cold;
      var segments = [
        { value: counts.hot, color: "var(--hot)" },
        { value: counts.warm, color: "var(--warm)" },
        { value: counts.cold, color: "var(--cold)" },
      ];
      var r = 15.9155;
      var circumference = 2 * Math.PI * r;
      var offset = 0;
      var html =
        '<svg viewBox="0 0 42 42" width="160" height="160" role="img" aria-label="Lead share by bucket" style="display:block; margin: 0 auto;">' +
        '<circle cx="21" cy="21" r="' + r + '" fill="transparent" stroke="var(--border)" stroke-width="6" opacity="0.5"></circle>';
      if (total > 0) {
        segments.forEach(function (seg) {
          var frac = seg.value / total;
          var dash = frac * circumference;
          var gap = circumference - dash;
          html +=
            '<circle cx="21" cy="21" r="' + r + '" fill="transparent" stroke="' + seg.color + '" stroke-width="6" ' +
            'stroke-dasharray="' + dash + ' ' + gap + '" stroke-dashoffset="' + (-offset) + '" ' +
            'stroke-linecap="round" transform="rotate(-90 21 21)"></circle>';
          offset += dash;
        });
      }
      html +=
        '<text x="21" y="24" font-size="7" font-family="IBM Plex Mono, monospace" text-anchor="middle" fill="var(--text-h)" font-weight="700">' + total + '</text>' +
        "</svg>";
      return html + legendHtml(counts);
    }

    function renderCountTable(counts) {
      return (
        '<table class="results" style="max-width:280px;"><thead><tr><th>Bucket</th><th>Count</th></tr></thead><tbody>' +
        '<tr><td><span class="bucket-badge bucket-hot">Hot</span></td><td class="num">' + counts.hot + '</td></tr>' +
        '<tr><td><span class="bucket-badge bucket-warm">Warm</span></td><td class="num">' + counts.warm + '</td></tr>' +
        '<tr><td><span class="bucket-badge bucket-cold">Cold</span></td><td class="num">' + counts.cold + '</td></tr>' +
        '</tbody></table>'
      );
    }

    function setChartType(type) {
      chartType = type;
      localStorage.setItem(CHART_TYPE_STORAGE, type);
      ["bar", "donut", "table"].forEach(function (t) {
        document.getElementById("chart-btn-" + t).classList.toggle("active", t === type);
      });
      renderChart();
    }

    function renderChart() {
      var counts = bucketCounts(currentLeads);
      var area = document.getElementById("chart-area");
      if (currentLeads.length === 0) {
        area.innerHTML = "";
        return;
      }
      if (chartType === "donut") area.innerHTML = renderDonutChart(counts);
      else if (chartType === "table") area.innerHTML = renderCountTable(counts);
      else area.innerHTML = renderBarChart(counts);
    }

    function renderResults(leads) {
      currentLeads = leads;
      document.getElementById("results-count").textContent = leads.length;
      document.getElementById("download-btn").disabled = leads.length === 0;
      document.getElementById("results-empty").style.display = leads.length === 0 ? "block" : "none";
      document.getElementById("results-table-wrap").style.display = leads.length === 0 ? "none" : "block";
      if (leads.length > 0) renderTable(leads);
      renderChart();
    }

    async function loadRealLeads() {
      try {
        var res = await fetch(API_BASE + "/leads", { headers: authHeaders() });
        if (res.status === 401) { disconnect(); return; }
        var leads = await res.json();
        renderResults(leads);
      } catch (err) {
        renderResults([]);
      }
    }

    function csvEscape(value) {
      var str = value == null ? "" : String(value);
      if (/[",\n]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
      return str;
    }

    function downloadCsv() {
      if (!currentLeads.length) return;
      var headers = ["Company", "Industry", "Fit Score", "Conversion Likelihood", "Combined Score", "Bucket"];
      var lines = [headers.map(csvEscape).join(",")];
      currentLeads.forEach(function (l) {
        lines.push([l.company_name, l.industry, l.fit_score, l.conversion_likelihood, l.combined_score, l.bucket].map(csvEscape).join(","));
      });
      var blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = "scored-leads.csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    document.getElementById("upload-input").addEventListener("change", function (e) {
      var file = e.target.files[0];
      document.getElementById("upload-filename").textContent = file ? file.name : "";
      document.getElementById("upload-btn").disabled = !file;
    });

    async function handleUpload() {
      var file = document.getElementById("upload-input").files[0];
      if (!file) return;
      var btn = document.getElementById("upload-btn");
      var errorEl = document.getElementById("upload-error");
      errorEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Scoring…";
      try {
        var form = new FormData();
        form.append("file", file);
        var res = await fetch(API_BASE + "/leads/upload", { method: "POST", headers: authHeaders(), body: form });
        var data = await res.json().catch(function () { return null; });
        if (!res.ok) throw new Error((data && data.detail) || "Upload failed.");
        if (isExample) dismissExample();
        renderResults(data);
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Score it";
      }
    }

    // Restore the visitor's last chart-type choice, then load either the
    // one-time example (brand-new signup) or their real saved leads.
    ["bar", "donut", "table"].forEach(function (t) {
      document.getElementById("chart-btn-" + t).classList.toggle("active", t === chartType);
    });
    if (isExample) {
      document.getElementById("example-banner").style.display = "flex";
      renderResults(EXAMPLE_LEADS);
    } else {
      loadRealLeads();
    }
  </script>
</body>
</html>
